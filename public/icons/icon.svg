<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b80710"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#redGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Film Strip Projector Frame -->
  <g transform="translate(96, 96)">
    <!-- Film Reel Box -->
    <rect x="20" y="20" width="280" height="280" rx="40" fill="#131924" stroke="#2a3447" stroke-width="8"/>
    
    <!-- Film Perforations Left -->
    <rect x="36" y="44" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="36" y="100" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="36" y="156" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="36" y="212" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="36" y="268" width="24" height="12" rx="6" fill="#e50914"/>

    <!-- Film Perforations Right -->
    <rect x="260" y="44" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="260" y="100" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="260" y="156" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="260" y="212" width="24" height="32" rx="6" fill="#e50914"/>
    <rect x="260" y="268" width="24" height="12" rx="6" fill="#e50914"/>

    <!-- Center Play Icon -->
    <polygon points="130,95 230,160 130,225" fill="url(#goldGrad)"/>
  </g>
</svg>
